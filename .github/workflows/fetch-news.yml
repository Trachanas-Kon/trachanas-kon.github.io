name: Fetch News Feed

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS feeds from Google News
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          BASE="https://news.google.com/rss/search?hl=el&gl=GR&ceid=GR:el&q="

          # 1: Ακραίφνιο
          curl -s --max-time 20 "${BASE}%CE%91%CE%BA%CF%81%CE%B1%CE%AF%CF%86%CE%BD%CE%B9%CE%BF" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed1.xml
          echo "Feed1 (Ακραίφνιο): $(wc -c < /tmp/feed1.xml) bytes"

          # 2: Ακραιφνία
          curl -s --max-time 20 "${BASE}%CE%91%CE%BA%CF%81%CE%B1%CE%B9%CF%86%CE%BD%CE%AF%CE%B1" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed2.xml
          echo "Feed2 (Ακραιφνία): $(wc -c < /tmp/feed2.xml) bytes"

          # 3: Πτώο Βοιωτία
          curl -s --max-time 20 "${BASE}%CE%A0%CF%84%CF%8E%CE%BF+%CE%92%CE%BF%CE%B9%CF%89%CF%84%CE%AF%CE%B1" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed3.xml
          echo "Feed3 (Πτώο Βοιωτία): $(wc -c < /tmp/feed3.xml) bytes"

          # 4: υπογραφές Ακραίφνιο
          curl -s --max-time 20 "${BASE}%CF%85%CF%80%CE%BF%CE%B3%CF%81%CE%B1%CF%86%CE%AD%CF%82+%CE%91%CE%BA%CF%81%CE%B1%CE%AF%CF%86%CE%BD%CE%B9%CE%BF" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed4.xml
          echo "Feed4 (υπογραφές Ακραίφνιο): $(wc -c < /tmp/feed4.xml) bytes"

          # 5: Πτώιος Δρόμος
          curl -s --max-time 20 "${BASE}%CE%A0%CF%84%CF%8E%CE%B9%CE%BF%CF%82+%CE%94%CF%81%CF%8C%CE%BC%CE%BF%CF%82" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed5.xml
          echo "Feed5 (Πτώιος Δρόμος): $(wc -c < /tmp/feed5.xml) bytes"

          # 6: permissos ακραιφνιου
          curl -s --max-time 20 "${BASE}permissos+%CE%B1%CE%BA%CF%81%CE%B1%CE%B9%CF%86%CE%BD%CE%B9%CE%BF%CF%85" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed6.xml
          echo "Feed6 (permissos ακραιφνιου): $(wc -c < /tmp/feed6.xml) bytes"

          # 7: permissos ακραιφνιο
          curl -s --max-time 20 "${BASE}permissos+%CE%B1%CE%BA%CF%81%CE%B1%CE%B9%CF%86%CE%BD%CE%B9%CE%BF" \
            -H "User-Agent: $UA" -H "Accept-Language: el-GR,el;q=0.9" -o /tmp/feed7.xml
          echo "Feed7 (permissos ακραιφνιο): $(wc -c < /tmp/feed7.xml) bytes"

      - name: Parse RSS feeds and write feed.json
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          def parse_feed(path):
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
                  channel = root.find('channel')
                  items = []
                  for item in channel.findall('item'):
                      title   = item.findtext('title', '')
                      pubDate = item.findtext('pubDate', '')
                      guid    = item.findtext('guid', '').strip()
                      source_el = item.find('source')
                      source = source_el.text.strip() if source_el is not None else ''
                      link_text = item.findtext('link', '').strip()
                      if link_text.startswith('http'):
                          link = link_text
                      elif guid.startswith('http'):
                          link = guid
                      elif guid:
                          link = 'https://news.google.com/articles/' + guid
                      else:
                          link = ''
                      items.append({'title': title, 'link': link, 'pubDate': pubDate, 'source': source})
                  return items
              except Exception as e:
                  print(f'Error parsing {path}: {e}')
                  return []

          items1 = parse_feed('/tmp/feed1.xml')
          items2 = parse_feed('/tmp/feed2.xml')
          items3 = parse_feed('/tmp/feed3.xml')
          items4 = parse_feed('/tmp/feed4.xml')
          items5 = parse_feed('/tmp/feed5.xml')
          items6 = parse_feed('/tmp/feed6.xml')
          items7 = parse_feed('/tmp/feed7.xml')

          # Merge and deduplicate by link
          seen = set()
          merged = []
          for item in items1 + items2 + items3 + items4 + items5 + items6 + items7:
              key = item['link'] or item['title']
              if key and key not in seen:
                  seen.add(key)
                  merged.append(item)

          # Sort by pubDate descending (newest first)
          def sort_key(item):
              try:
                  return parsedate_to_datetime(item['pubDate'])
              except Exception:
                  return datetime.min.replace(tzinfo=timezone.utc)

          merged.sort(key=sort_key, reverse=True)

          # Find the most recent article date
          newest_iso = None
          for item in merged:
              try:
                  d = parsedate_to_datetime(item['pubDate'])
                  newest_iso = d.isoformat()
                  break
              except Exception:
                  pass

          output = {
              'updated':     datetime.now(timezone.utc).isoformat(),
              'count':       len(merged),
              'newest_item': newest_iso,
              'items':       merged,
          }
          print(f'Parsed {len(items1)} + {len(items2)} + {len(items3)} + {len(items4)} + {len(items5)} + {len(items6)} + {len(items7)} = {len(merged)} unique items')
          if newest_iso:
              print(f'Newest article: {newest_iso}')

          with open('news/feed.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/feed.json
          git diff --cached --quiet && echo "No changes." || \
            (git commit -m "chore: update news feed [skip ci]" && git push)
